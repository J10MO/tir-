# Render Blueprint: one free web service that serves the API and the built React app.
# The database is on Neon; paste its connection string as DATABASE_URL when Render asks.
services:
  - type: web
    name: tir
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
